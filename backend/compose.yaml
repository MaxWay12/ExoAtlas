x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://catalog:${POSTGRES_PASSWORD:-catalog}@db:5432/catalog

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - catalog-data:/var/lib/postgresql

  importer:
    <<: *app
    command: ["python", "-m", "catalog.import_catalog"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      importer:
        condition: service_completed_successfully

  scheduler:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "catalog.refresh_schedule"]
    depends_on:
      db:
        condition: service_healthy
      importer:
        condition: service_completed_successfully

volumes:
  catalog-data:
