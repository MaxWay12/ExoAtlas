services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
